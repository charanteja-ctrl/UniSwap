<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Clean rounded white container -->
  <rect x="2" y="2" width="116" height="116" rx="26" ry="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- Mortarboard Graduation Cap -->
  <!-- Top diamond board -->
  <polygon points="60,18 96,30 60,42 24,30" fill="#132247" />
  <!-- Skullcap underside -->
  <path d="M 38 36 L 38 48 C 38 56, 82 56, 82 48 L 82 36 Z" fill="#132247" />
  <!-- Cap tassel -->
  <path d="M 92 31.5 L 94 48" stroke="#132247" stroke-width="2" stroke-linecap="round" />
  <circle cx="94" cy="50" r="2.5" fill="#132247" />

  <!-- U-Swap Arrows -->
  <!-- Left Side: Navy Arrow pointing UP -->
  <!-- Arrow Head UP -->
  <polygon points="41,48 27,60 35,60 35,76 C 35,88 47,94 60,94 L 60,83 C 53,83 46,79 46,72 L 46,60 55,60" fill="#132247" />

  <!-- Right Side: Green Arrow pointing DOWN -->
  <!-- Arrow Head DOWN -->
  <polygon points="79,72 93,60 85,60 85,46 C 85,44 83,43 80,43 L 73,43 L 73,54 L 75,54 C 75,54 75,60 75,60 L 65,60" fill="#239867" />
  <path d="M 60,94 C 73,94 85,86 85,72 L 85,60 L 73,60 L 73,72 C 73,78 68,83 60,83 Z" fill="#239867" />
</svg>
